[project]
name = "auth-back-starter"
version = "0.1.0"
description = "Layered FastAPI starter with PostgreSQL server sessions"
requires-python = "==3.14.8"
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0.48,<3",
    "asyncpg>=0.31,<1",
    "alembic>=1.15,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "argon2-cffi>=25.1,<26",
    "redis>=8.1,<9",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.0,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
